<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // No-flash theme: stored choice wins, else follow the OS preference. Runs before paint.
      try {
        const stored = localStorage.getItem('fmp-theme')
        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <script>
      // No-flash consent banner: hide it before paint for anyone who has already chosen.
      const storedConsent = () => {
        try {
          return localStorage.getItem('fmp-consent')
        } catch (e) {
          return null
        }
      }
      if (
        navigator.globalPrivacyControl === true ||
        navigator.doNotTrack === '1' ||
        storedConsent() === 'granted' ||
        storedConsent() === 'denied'
      ) {
        document.documentElement.dataset.consentDecided = ''
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
